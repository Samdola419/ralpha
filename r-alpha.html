<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#f5f1e8">
<title>R Alpha</title>
<meta name="description" content="R Alpha, a private chat client for Dahl and Token Harbor models.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f3b33'/%3E%3Cpath d='M26 10C20 10 15 23 9.5 23C6 23 5 19.5 5 16.5C5 13.5 7 9.5 10.5 9.5C16 9.5 19 23 26 22' fill='none' stroke='%23f5f1e8' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round' transform='translate(1 0)'/%3E%3Ccircle cx='11.5' cy='16.5' r='2' fill='%23dc9d2e'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f1e8;--side:#ece6d7;--card:#fbf9f4;--ink:#1c1a16;--mute:#706a5d;--line:#dcd5c4;--harbor:#1f3b33;--on:#f5f1e8;--ochre:#dc9d2e;--brick:#a8452d;--code:#ebe5d4;
--serif:"Fraunces",Georgia,"Times New Roman",serif;--sans:"Instrument Sans","Helvetica Neue",Arial,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;color-scheme:light}
:root[data-theme="dark"]{--bg:#1b1915;--side:#15130f;--card:#25221c;--ink:#ece6d8;--mute:#9b9486;--line:#36322a;--harbor:#d8c8a2;--on:#1b1915;--brick:#dc705a;--code:#2c2922;color-scheme:dark}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1915;--side:#15130f;--card:#25221c;--ink:#ece6d8;--mute:#9b9486;--line:#36322a;--harbor:#d8c8a2;--on:#1b1915;--brick:#dc705a;--code:#2c2922;color-scheme:dark}}
*{box-sizing:border-box;margin:0}
html,body{height:100%}body{height:100dvh}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);display:grid;grid-template-columns:272px 1fr;overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body.collapsed{grid-template-columns:0 1fr}
body.collapsed aside{visibility:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
input:focus-visible,textarea:focus-visible{outline:none}
svg{display:block}
[hidden]{display:none!important}

/* logo: the dot carries the mood. Variables inherit into <use>, selectors do not. */
.dot{fill:var(--dotfill,var(--ochre));transform:var(--dottf,none);transform-box:fill-box;transform-origin:center;animation:var(--dotanim,none);transition:fill .3s}
body[data-state="thinking"]{--dotanim:bob .9s ease-in-out infinite}
body[data-state="error"]{--dotfill:var(--brick);--dottf:translate(3px,4px)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px) scale(1.15)}}
@media(prefers-reduced-motion:reduce){body[data-state="thinking"]{--dotanim:none}}
.mk{color:var(--harbor)}

/* mascot: smooth, driven by body[data-state]; pupils follow the pointer */
.mascot{display:block;flex:none;overflow:visible}
.mascot .shell{fill:var(--harbor)}
.mascot .stem{stroke:var(--harbor);stroke-width:3;stroke-linecap:round}
.mascot .lamp{fill:var(--ochre);transition:fill .3s}
.mascot .body{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 4.5s ease-in-out infinite}
.mascot .eyes{transform-box:fill-box;transform-origin:center;animation:blink 6s ease-in-out infinite}
.mascot .ew{fill:var(--bg)}
.mascot .pupils{fill:var(--harbor);transform:translate(var(--lx,0px),var(--ly,0px));transition:transform .2s ease-out}
.mascot .m{fill:none;stroke:var(--bg);stroke-width:3.2;stroke-linecap:round;opacity:0;transition:opacity .25s}
.mascot .smile{opacity:1}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.025,1.03)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
@keyframes ponder{0%,100%{transform:translate(-3.5px,-4px)}50%{transform:translate(3.5px,-4px)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
@keyframes glance{0%,60%,100%{transform:translate(0,0)}68%,80%{transform:translate(3px,1px)}88%,95%{transform:translate(-3px,0)}}
@media(hover:none){.mascot .pupils{animation:glance 11s ease-in-out infinite}}
body[data-state="thinking"] .mascot .pupils{animation:ponder 2.8s ease-in-out infinite}
body[data-state="thinking"] .mascot .lamp{animation:pulse 1.5s ease-in-out infinite}
body[data-state="thinking"] .mascot .smile{opacity:0}
body[data-state="thinking"] .mascot .oh{opacity:1}
body[data-state="error"] .mascot .lamp{fill:var(--brick)}
body[data-state="error"] .mascot .smile{opacity:0}
body[data-state="error"] .mascot .frown{opacity:1}
body[data-state="error"] .mascot .pupils{animation:none;transform:translate(0,4px)}
body[data-state="error"] .mascot .body{animation:shake .5s ease-in-out 1,breathe 4.5s ease-in-out .5s infinite}
@media(prefers-reduced-motion:reduce){.mascot .body,.mascot .eyes,.mascot .pupils,.mascot .lamp{animation:none!important}}
aside{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 12px;font:500 21px var(--serif);letter-spacing:-.01em;white-space:nowrap}
.newchat{margin:6px 12px 8px;padding:9px 12px;display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);background:var(--card);border-radius:7px;font-weight:500}
.newchat:hover{border-color:var(--mute)}
.newchat kbd{font:11px var(--mono);color:var(--mute)}
.list{flex:1;overflow:auto;padding:6px 8px}
.list h3{font:500 12px var(--sans);color:var(--mute);padding:10px 10px 4px}
.item{display:flex;align-items:center;border-radius:6px;color:var(--mute)}
.item>button:first-child{flex:1;min-width:0;text-align:left;padding:7px 10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item:hover,.item.on{background:var(--card);color:var(--ink)}
.del{opacity:0;padding:6px 8px;color:var(--mute)}
.item:hover .del,.del:focus-visible{opacity:1}
.none{padding:10px;color:var(--mute);font-size:13.5px}
.foot{border-top:1px solid var(--line);padding:8px 10px;display:flex;align-items:center;gap:2px}
.foot button{padding:7px 9px;border-radius:6px;color:var(--mute);display:flex;gap:8px;align-items:center}
.foot button:hover{background:var(--card);color:var(--ink)}
.foot .sp{flex:1}

main{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0}
header{display:flex;align-items:center;gap:6px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;min-height:50px}
header .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mute);padding-left:6px}
.ib{padding:7px;border-radius:6px;color:var(--mute)}
.ib:hover{background:var(--side);color:var(--ink)}
.scroll{flex:1;overflow:auto;padding:0 20px;overscroll-behavior:contain}
.col{max-width:728px;margin:0 auto}
main.empty{justify-content:center;padding-bottom:6vh}
main.empty header{position:absolute;top:0;left:0;right:0}
main.empty .scroll{flex:0 1 auto;overflow:auto;padding-top:56px;min-height:0}
main.nokey .composer{display:none}
main.nokey{padding-bottom:0}

/* empty state */
.hello{max-width:728px;margin:0 auto 22px;display:flex;flex-direction:column;align-items:center;text-align:center}
.hello .mascot{margin-bottom:20px}
.hello h1{font:400 clamp(30px,4.4vw,42px)/1.12 var(--serif);letter-spacing:-.02em}
.setup{width:100%;text-align:left;margin-top:26px;border:1px solid var(--line);border-radius:10px;background:var(--card);overflow:hidden}
.prov{display:grid;grid-template-columns:150px 1fr auto;gap:10px 14px;align-items:center;padding:14px 16px}
.prov+.prov{border-top:1px solid var(--line)}
.prov .pn b{font:500 17px var(--serif);display:block}
.prov .pn a{font-size:12.5px;color:var(--mute)}
.prov input{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 11px;min-width:0;width:100%}
.prov input:focus{border-color:var(--mute);outline:none}
.go{padding:9px 16px;border-radius:6px;background:var(--harbor);color:var(--on);font-weight:500}
.go:disabled{opacity:.5}
.pmsg{grid-column:2/4;font-size:12.5px;color:var(--mute);margin-top:-4px}
.pmsg.bad{color:var(--brick)}
.fine{margin-top:10px;font-size:12.5px;color:var(--mute);text-align:center}

/* messages */
.msg{padding:12px 0}
.msg.user{display:flex;justify-content:flex-end}
.msg.user .body{max-width:86%;background:var(--side);padding:10px 15px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.bot .body{font-size:16px;line-height:1.7}
.body p{margin:0 0 .9em}.body p:last-child{margin:0}
.body h3{font:500 19px/1.3 var(--serif);margin:1.3em 0 .4em}
.body ul,.body ol{margin:0 0 .9em 1.4em}.body li{margin:.25em 0}
.body code{font:13.5px var(--mono);background:var(--code);padding:1px 5px;border-radius:4px}
.body pre{background:var(--code);border-radius:8px;margin:.5em 0 1.1em;overflow:hidden}
.body pre .bar{display:flex;justify-content:space-between;align-items:center;padding:6px 12px 6px 14px;font:12px var(--mono);color:var(--mute);border-bottom:1px solid var(--line)}
.body pre .bar button{color:var(--mute);font:inherit;padding:2px 6px;border-radius:4px}
.body pre .bar button:hover{color:var(--ink)}
.body pre code{display:block;background:none;padding:13px 14px;overflow-x:auto;line-height:1.6;font-size:13.5px}
.think{margin:0 0 1em;color:var(--mute);font-size:14.5px;border-left:2px solid var(--line);padding-left:12px}
.think summary{cursor:pointer;list-style:none}
.think summary::before{content:"+ ";font-family:var(--mono)}
.think[open] summary::before{content:"- "}
.think div{white-space:pre-wrap;margin-top:6px;line-height:1.6}
.wait{display:flex;align-items:center;gap:10px;color:var(--mute);font-size:14.5px}
.tools{display:flex;align-items:center;gap:2px;margin-top:8px;color:var(--mute);font-size:13px}
.tools button{padding:3px 8px;border-radius:5px;color:var(--mute)}
.tools button:hover{background:var(--side);color:var(--ink)}
.meta{font:12px var(--mono);padding:3px 8px}
.err{border:1px solid var(--brick);border-radius:8px;padding:10px 14px;color:var(--brick);font-size:15px;line-height:1.55}

/* composer */
.composer{padding:6px 20px calc(16px + env(safe-area-inset-bottom))}
main.empty .composer{padding-bottom:0}
.box{position:relative;max-width:728px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 14px 10px;box-shadow:0 10px 28px -20px rgba(40,30,10,.5)}
.box:focus-within{border-color:var(--mute)}
textarea{display:block;width:100%;border:0;background:none;resize:none;outline:none;max-height:240px;padding:0 2px;line-height:1.55;font-size:16px}
textarea::placeholder{color:var(--mute)}
.row{display:flex;align-items:center;justify-content:flex-end;gap:6px;margin-top:10px}
.mbtn{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:7px;color:var(--mute);max-width:70%}
.mbtn:hover,.mbtn[aria-expanded="true"]{background:var(--side);color:var(--ink)}
.mbtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.send{width:34px;height:34px;border-radius:8px;background:var(--harbor);color:var(--on);display:grid;place-items:center;flex:none}
.send:disabled{opacity:.3;cursor:default}
.hint{max-width:728px;margin:8px auto 0;font-size:12px;color:var(--mute);text-align:center}
main.empty .hint{display:none}
.pop{position:absolute;right:6px;bottom:calc(100% + 8px);width:min(360px,94%);background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 16px 36px -16px rgba(30,20,0,.5);padding:6px;z-index:6;display:flex;flex-direction:column;max-height:min(68dvh,540px)}
.pop input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;margin-bottom:4px;outline:none}
.ml{max-height:300px;overflow:auto}
.mh{font:500 12px var(--sans);color:var(--mute);padding:8px 8px 3px}
.mi{display:block;width:100%;text-align:left;padding:7px 8px;border-radius:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.mi:hover{background:var(--side)}
.mi.on{background:var(--side);font-weight:600}
.mi.add{color:var(--mute);font-style:italic}

dialog{margin:auto;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);width:min(520px,94vw);padding:0;max-height:92dvh;overflow:auto}
dialog::backdrop{background:rgba(18,15,8,.5)}
.dlg{padding:22px 24px}
.dlg h2{font:500 24px var(--serif);margin-bottom:14px}
.dlg fieldset{border:0;border-top:1px solid var(--line);padding:14px 0 8px}
.dlg legend{font:500 17px var(--serif);padding-right:10px}
.dlg label{display:block;font-size:12.5px;color:var(--mute);margin:8px 0 3px}
.dlg input{width:100%;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:9px 11px}
.dlg input:focus,.dlg textarea:focus{border-color:var(--mute)}
.dlg textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px 11px;font-size:14px;line-height:1.5;min-height:180px;resize:vertical;max-height:none}
.dlg .chk{display:flex;gap:9px;align-items:flex-start;margin-top:10px;font-size:13.5px;color:var(--ink)}
.dlg .chk input{width:auto;margin-top:3px}
.dlg .rm.soft{color:var(--mute)}
.dlg details{margin-top:8px;font-size:13px;color:var(--mute)}
.dlg summary{cursor:pointer}
.dlg .rm{font-size:12.5px;color:var(--brick);margin-top:6px;padding:0;text-decoration:underline}
.acts{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.acts button{padding:9px 18px;border-radius:7px;border:1px solid var(--line)}
.acts .pri{background:var(--harbor);color:var(--on);border-color:var(--harbor);font-weight:500}

.ml{flex:1 1 auto;overflow:auto;min-height:0}
.addid{width:100%;margin:2px 0 6px;font-size:13px;padding:6px 8px;background:none;border:1px dashed var(--line);border-radius:6px;color:var(--ink)}
.addid:focus{border-color:var(--mute);border-style:solid}
.eff{border-top:1px solid var(--line);margin-top:4px;padding-top:2px}
.seg{display:flex;gap:4px;padding:2px 4px 0}
.seg button{flex:1;padding:7px 4px;border:1px solid var(--line);border-radius:7px;font-size:13.5px;color:var(--mute)}
.seg button:hover{color:var(--ink);border-color:var(--mute)}
.seg button.on{background:var(--harbor);color:var(--on);border-color:var(--harbor)}
.effnote{font-size:12px;color:var(--mute);padding:6px 8px 4px}
.note{display:flex;align-items:center;gap:12px;margin:10px 0;color:var(--mute);font:12.5px var(--mono)}
.note::before,.note::after{content:"";flex:1;height:1px;background:var(--line)}
.note span{max-width:70%;text-align:center}
.jump{position:absolute;left:50%;top:-40px;transform:translateX(-50%);width:34px;height:34px;border-radius:50%;background:var(--card);border:1px solid var(--line);color:var(--ink);display:grid;place-items:center;z-index:3}
.jump:hover{border-color:var(--mute)}
.composer{position:relative}
.sbox{padding:0 12px 6px}
.sbox input{width:100%;background:var(--card);border:1px solid var(--line);border-radius:7px;padding:8px 10px;outline:none}
.sbox input:focus{border-color:var(--mute)}
.body table{border-collapse:collapse;margin:.4em 0 1em;font-size:14.5px;display:block;overflow-x:auto;max-width:100%}
.body th,.body td{border:1px solid var(--line);padding:6px 11px;text-align:left}
.body th{background:var(--side);font-weight:600}
.body blockquote{border-left:3px solid var(--line);padding-left:14px;color:var(--mute);margin:0 0 .9em}
.body hr{border:0;border-top:1px solid var(--line);margin:1.2em 0}
.body a{text-decoration:underline;text-underline-offset:3px}
.scrim{display:none}
@media(hover:none){.del{opacity:.6}}
@media(max-width:760px){
  body,body.collapsed{grid-template-columns:1fr}
  aside,body.collapsed aside{visibility:visible;position:fixed;top:0;bottom:0;left:0;width:min(300px,84vw);z-index:20;transform:translateX(-102%);transition:transform .2s;padding-top:env(safe-area-inset-top)}
  body.open aside{transform:none}
  body.open .scrim{display:block;position:fixed;inset:0;background:rgba(18,15,8,.45);z-index:15}
  .ib{padding:10px}
  .item>button:first-child{padding:12px}
  .del{padding:10px 12px}
  .newchat{padding:12px}.newchat kbd{display:none}
  .scroll{padding:0 14px}
  .hello h1{font-size:30px}
  .hello .mascot{width:84px;height:auto}
  .prov{grid-template-columns:1fr}.pmsg{grid-column:1}
  .go{width:100%;padding:12px}
  .prov input,.dlg input,.dlg textarea,.pop input{font-size:16px}
  .msg.user .body{max-width:92%}
  .composer{padding:4px 12px calc(10px + env(safe-area-inset-bottom))}
  main.empty{padding-bottom:calc(4vh + env(safe-area-inset-bottom))}
  .box{border-radius:14px;padding:12px 12px 8px}
  .hint{display:none}
  .pop{right:0;width:100%}
  .ml{max-height:44dvh}
  .dlg{padding:18px 16px}
  body.menuopen::after{content:"";position:fixed;inset:0;background:rgba(18,15,8,.42);z-index:30}
  .pop{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));width:auto;max-height:78dvh;z-index:31;border-radius:16px}
  .mi{padding:13px 12px;font-size:15px}
  .addid{font-size:16px;padding:10px}
  .seg button{min-height:44px}
  .sbox input{font-size:16px}
  dialog{width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;border:0;border-radius:0;margin:0}
  .acts{position:sticky;bottom:0;background:var(--bg);padding:12px 0 calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);margin-top:10px}
  .acts button{flex:1;padding:13px}
  .tools button{padding:9px 12px}
  .jump{top:-46px}
  .note span{max-width:78%}
}
</style>
</head>
<body data-state="idle">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="m" viewBox="0 0 32 32"><path d="M26 10C20 10 15 23 9.5 23C6 23 5 19.5 5 16.5C5 13.5 7 9.5 10.5 9.5C16 9.5 19 23 26 22" transform="translate(1 0)" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle class="dot" cx="11.5" cy="16.5" r="2.1"/></symbol></svg>

<div class="scrim" id="scrim"></div>
<aside>
  <div class="brand"><svg class="mk" width="28" height="28"><use href="#m"/></svg>R Alpha</div>
  <button class="newchat" id="new"><span>New chat</span><kbd id="kbd">Ctrl K</kbd></button>
  <div class="sbox" id="sbox" hidden><input id="q" placeholder="Search chats" aria-label="Search chats" autocomplete="off"></div>
  <div class="list" id="list"></div>
  <div class="foot">
    <button id="gear" aria-label="API keys"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="5.5" cy="8" r="3"/><path d="M8.5 8H15M13 8v2.5M11 8v1.5"/></svg>API keys</button>
    <span class="sp"></span>
    <button id="theme" aria-label="Switch light and dark"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="5.5"/><path d="M8 2.5a5.5 5.5 0 0 1 0 11z" fill="currentColor"/></svg></button>
  </div>
</aside>

<main id="main">
  <header>
    <button class="ib" id="side" aria-label="Toggle chat list"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="14" height="12" rx="2"/><path d="M8 4v12"/></svg></button>
    <div class="t" id="title"></div>

<script>

const effortState=id=>S.cap[id]||(/gpt|claude|gemini|grok|deepseek|glm|qwen|kimi|minimax|muse|^o\d/i.test(id)?'maybe':'no');
const L0={x:0,y:0};
async function copyText(t){

}
function flash(b,ok){const o=b.dataset.l||b.textContent;b.dataset.l=o;b.textContent=ok?'Copied':'Copy failed';setTimeout(()=>b.textContent=o,1300)}
function noteText(m){if(m.from&&m.to){const n=x=>{const [k,id]=x.split('|');return PRE[k].name+' / '+short(id)};return 'Model changed: '+n(m.from)+' to '+n(m.to)}return m.content||''}
async function loadModels(k){

    const ids=arr.map(x=>x.id);

/* markdown */
function md(src){
  const blocks=[];
  src=src.replace(/```(\w*)\n?([\s\S]*?)(```|$)/g,(_,l,c)=>{blocks.push(`<pre><div class="bar"><span>${esc(l||'text')}</span><button data-copy>Copy</button></div><code>${esc(c.replace(/\n$/,''))}</code></pre>`);return `\u0000${blocks.length-1}\u0000`});
  const inl=t=>esc(t).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/(^|\W)\*([^*\n]+)\*/g,'$1<i>$2</i>').replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  const L=src.split('\n'),out=[];let list=null,i=0;
  const close=()=>{if(list){out.push(`</${list}>`);list=null}};
  const cells=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
  while(i<L.length){const ln=L[i];let m;
    if(m=ln.match(/^\u0000(\d+)\u0000$/)){close();out.push(blocks[m[1]])}
    else if(/^\s*\|/.test(ln)&&i+1<L.length&&/^\s*\|?\s*:?-{2,}/.test(L[i+1])){
      close();const hd=cells(ln);i+=2;let rows='';
      while(i<L.length&&/^\s*\|/.test(L[i])){rows+='<tr>'+cells(L[i]).map(c=>`<td>${inl(c)}</td>`).join('')+'</tr>';i++}
      i--;out.push(`<table><thead><tr>${hd.map(c=>`<th>${inl(c)}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table>`)}
    else if(m=ln.match(/^#{1,4}\s+(.*)/)){close();out.push(`<h3>${inl(m[1])}</h3>`)}
    else if(/^\s*([-*_])(\s*\1){2,}\s*$/.test(ln)){close();out.push('<hr>')}
    else if(m=ln.match(/^>\s?(.*)/)){close();out.push(`<blockquote>${inl(m[1])}</blockquote>`)}
    else if(m=ln.match(/^\s*[-*]\s+(.*)/)){if(list!=='ul'){close();out.push('<ul>');list='ul'}out.push(`<li>${inl(m[1])}</li>`)}
    else if(m=ln.match(/^\s*\d+[.)]\s+(.*)/)){if(list!=='ol'){close();out.push('<ol>');list='ol'}out.push(`<li>${inl(m[1])}</li>`)}
    else if(!ln.trim())close();
    else{close();out.push(`<p>${inl(ln)}</p>`)}
    i++}
  close();return out.join('');
}
function bodyHTML(m){
  let c=m.content||'',th=m.think||'';
  const x=c.match(/<think>([\s\S]*?)(<\/think>|$)/);if(x){th+=x[1];c=c.replace(x[0],'')}
  if(m.err)return `<div class="err">${esc(m.err)}</div>`;
  const t=th.trim()?`<details class="think"${m.live&&!c.trim()?' open':''}><summary>Reasoning</summary><div>${esc(th.trim())}</div></details>`:'';
  if(m.live&&!c.trim()&&!t)return `<div class="wait">${mascot(30)}Thinking</div>`;
  return t+md(c);
}

/* render */
function renderList(){
  const L=$('#list'),q=($('#q').value||'').trim().toLowerCase();
  $('#sbox').hidden=S.chats.length<6&&!q;
  const rows=S.chats.filter(c=>!q||c.title.toLowerCase().includes(q)||c.msgs.some(m=>m.content&&m.content.toLowerCase().includes(q))).sort((a,b)=>b.t-a.t);
  if(!rows.length){L.innerHTML=`<div class="none">${S.chats.length?'No chats match.':'Your chats will show up here.'}</div>`;return}
  const day=864e5,now=new Date().setHours(0,0,0,0);
  const grp=t=>t>=now?'Today':t>=now-day?'Yesterday':t>=now-7*day?'Previous 7 days':'Older';
  let last='',h='';
  rows.forEach(c=>{const g=grp(c.t);if(g!==last){h+=`<h3>${g}</h3>`;last=g}
    h+=`<div class="item${c.id===S.cur?' on':''}"><button data-open="${c.id}">${esc(c.title)}</button><button class="del" data-del="${c.id}" aria-label="Delete chat"><svg width="13" height="13" viewBox="0 0 14 14" stroke="currentColor" stroke-width="1.5" fill="none"><path d="M3 3l8 8M11 3l-8 8"/></svg></button></div>`});
  L.innerHTML=h;
}
function setup(){
  return `<div class="setup">${KEYS.map(k=>{const p=PRE[k];return `<form class="prov" data-k="${k}"><div class="pn"><b>${p.name}</b><a href="${p.get}" target="_blank" rel="noopener">${p.host}</a></div><input type="password" autocomplete="off" placeholder="${p.ph}" aria-label="${p.name} API key"><button class="go">Connect</button><p class="pmsg" id="pm-${k}"></p></form>`}).join('')}</div><p class="fine">Keys stay in this browser and are sent only to the provider they belong to.</p>`;
}
function render(){
  const c=cur(),any=entries().length,empty=!c||!c.msgs.length;
  $('#main').classList.toggle('empty',empty);$('#main').classList.toggle('nokey',!any);if(empty)$('#jump').hidden=true;
  $('#title').textContent=c?c.title:'';
  const T=$('#stage');
  if(empty){
    T.innerHTML=`<div class="hello">${mascot(96)}<h1>${any?G:'Welcome. Add an API key to start.'}</h1>${any?'':setup()}</div>`;
  }else{
    T.innerHTML='<div class="col"></div>';const col=T.firstChild;
    const lastBot=c.msgs.map(m=>m.role).lastIndexOf('assistant');
    c.msgs.forEach((m,i)=>{
      const d=document.createElement('div');
      if(m.role==='note'){d.className='note';d.innerHTML=`<span>${esc(noteText(m))}</span>`}
      else if(m.role==='user'){d.className='msg user';d.innerHTML=`<div class="body">${esc(m.content)}</div>`}
      else{d.className='msg bot';const last=i===lastBot;
        d.innerHTML=`<div class="body" data-i="${i}">${bodyHTML(m)}</div>${m.live?'':`<div class="tools"><button data-cm="${i}">Copy</button>${last?'<button data-regen>Retry</button>':''}<span class="meta">${esc(m.by||'')}${m.ms?' · '+(m.ms/1000).toFixed(1)+'s':''}</span></div>`}`}
      col.appendChild(d);
    });
  }
  const ta=$('#in');ta.disabled=!any;ta.placeholder=any?'Message R Alpha':'Add an API key above to start chatting';
  $('#mlabel').textContent=any?short(S.model.split('|')[1]||'')+((S.effort[S.model]||'auto')!=='auto'&&effortState(S.model.split('|')[1]||'')!=='no'?' \u00b7 '+S.effort[S.model]:''):'No model';
  $('#mbtn').disabled=!any;renderList();gate();
}
const bottom=()=>{const s=$('#scroll');s.scrollTop=s.scrollHeight};
function gate(){const b=$('#send');b.innerHTML=busy?STOP:SEND;b.setAttribute('aria-label',busy?'Stop':'Send');b.disabled=busy?false:(!$('#in').value.trim()||!entries().length)}

/* model menu */
function buildMenu(){
  const p=$('#pop');let h='';
  if(entries().length>8)h+='<input id="mf" placeholder="Filter models" aria-label="Filter models" autocomplete="off">';
  h+='<div class="ml" role="listbox">';
  KEYS.forEach(k=>{h+=`<div class="mh">${PRE[k].name}</div>`;
    if(!S.keys[k]){h+='<button class="mi add" data-settings>Add API key</button>';return}
    mods(k).forEach(id=>{const v=k+'|'+id;h+=`<button class="mi${v===S.model?' on':''}" role="option" data-pick="${esc(v)}" data-t="${esc(id.toLowerCase())}">${esc(short(id))}</button>`});
    h+=`<input class="addid" data-k="${k}" placeholder="Add a model id, press Enter" aria-label="Add a ${PRE[k].name} model id" autocomplete="off">`});
  h+='</div>';
  const id=S.model.split('|')[1]||'',st=effortState(id),cu=S.effort[S.model]||'auto';
  h+='<div class="eff"><div class="mh">Thinking effort</div>';
  if(st==='no')h+='<p class="effnote">This model has no effort setting.</p>';
  else h+='<div class="seg" role="group">'+['auto','low','medium','high'].map(e=>`<button data-eff="${e}" class="${cu===e?'on':''}" aria-pressed="${cu===e}">${e[0].toUpperCase()+e.slice(1)}</button>`).join('')+'</div><p class="effnote">'+(st==='yes'?'This model supports it.':'Not confirmed for this model. If it rejects the setting, R Alpha drops it and remembers.')+' Auto leaves it to the model.</p>';
  h+='</div>';p.innerHTML=h;
  const f=$('#mf');if(f)f.oninput=()=>{const q=f.value.toLowerCase();p.querySelectorAll('[data-t]').forEach(b=>b.hidden=!b.dataset.t.includes(q))};
  p.querySelectorAll('.addid').forEach(i=>i.onkeydown=e=>{if(e.key!=='Enter')return;e.preventDefault();const v=i.value.trim();if(!v)return;const k=i.dataset.k;S.custom[k]=[...new Set([...(S.custom[k]||[]),v])];save();setModel(k+'|'+v)});
}
function openMenu(){
  const p=$('#pop');if(!p.hidden){closeMenu();return}
  buildMenu();p.hidden=false;document.body.classList.add('menuopen');$('#mbtn').setAttribute('aria-expanded','true');
  const f=$('#mf');if(f&&matchMedia('(hover:hover)').matches)f.focus();
}
function setModel(v){
  const old=S.model;S.model=v;closeMenu();
  const c=cur();
  if(c&&old&&old!==v&&c.msgs.some(m=>m.role==='user')){
    const last=c.msgs[c.msgs.length-1];
    if(last&&last.role==='note'&&last.from){last.to=v;if(last.from===v)c.msgs.pop()}
    else c.msgs.push({role:'note',from:old,to:v});
  }
  save();render();
}
function closeMenu(){$('#pop').hidden=true;document.body.classList.remove('menuopen');$('#mbtn').setAttribute('aria-expanded','false')}

/* chat */
function newChat(){if(busy&&ctrl)ctrl.abort();S.cur=null;save();closeMenu();if(!busy)document.body.dataset.state='idle';render();if(matchMedia('(hover:hover)').matches)$('#in').focus();document.body.classList.remove('open')}
async function send(regen){
  if(busy){ctrl&&ctrl.abort();return}
  if(!entries().length)return;
  if(!entries().includes(S.model))S.model=entries()[0];
  let c=cur();
  if(!regen){
    const txt=$('#in').value.trim();if(!txt)return;
    if(!c){c={id:uid(),title:txt.slice(0,50),msgs:[],t:Date.now()};S.chats.push(c);S.cur=c.id}
    c.msgs.push({role:'user',content:txt});$('#in').value='';$('#in').style.height='auto';
  }else{const lu=c.msgs.map(m=>m.role).lastIndexOf('user');c.msgs=c.msgs.filter((m,i)=>!(i>lu&&m.role==='assistant'))}
  const [k,model]=S.model.split('|');
  const bot={role:'assistant',content:'',think:'',live:true,by:PRE[k].name+' / '+short(model)};
  c.msgs.push(bot);c.t=Date.now();busy=true;ctrl=new AbortController();
  document.body.dataset.state='thinking';render();bottom();
  const t0=performance.now(),idx=()=>c.msgs.indexOf(bot);
  const paint=()=>{const el=document.querySelector(`.body[data-i="${idx()}"]`);if(el){el.innerHTML=bodyHTML(bot);const s=$('#scroll');if(s.scrollHeight-s.scrollTop-s.clientHeight<160)bottom()}};
  try{
    const hist=c.msgs.slice(0,-1).filter(m=>m.role==='user'||(m.role==='assistant'&&m.content)).map(m=>({role:m.role,content:m.content}));
    const sys=sysFor(),eff=S.effort[S.model];
    const go=we=>{const body={model,stream:true,messages:[...(sys?[{role:'system',content:sys}]:[]),...hist]};if(we)body.reasoning_effort=eff;
      return fetch(base(k)+'/chat/completions',{method:'POST',signal:ctrl.signal,headers:{'Content-Type':'application/json',Authorization:'Bearer '+S.keys[k]},body:JSON.stringify(body)})};
    const useEff=!!eff&&eff!=='auto'&&effortState(model)!=='no';
    let res=await go(useEff);
    if(!res.ok&&useEff&&res.status===400){
      let tx='';try{tx=JSON.stringify(await res.clone().json())}catch(_){}
      if(/reason|effort|think|unsupported|unknown|unrecogni|additional|extra|parameter/i.test(tx)){
        S.cap[model]='no';save();
        c.msgs.splice(c.msgs.length-1,0,{role:'note',content:short(model)+' does not take an effort setting, so this reply was sent on Auto.'});
        render();res=await go(false);
      }
    }
    if(!res.ok){
      let d='';try{const j=await res.json();d=j.error?.message||j.message||''}catch(_){}
      const why=res.status===401||res.status===403?'rejected the key.':res.status===402||res.status===429?'refused the request (balance or rate limit).':`returned ${res.status}.`;
      throw new Error(`${PRE[k].name} ${why}${d?' '+d:''} ${res.status<500?PRE[k].hint:''}`);
    }
    if(!(res.headers.get('content-type')||'').includes('event-stream')){
      const j=await res.json(),m=j.choices?.[0]?.message||{};bot.content=m.content||'';bot.think=m.reasoning_content||m.reasoning||'';
    }else{
      const rd=res.body.getReader(),dec=new TextDecoder();let buf='';
      for(;;){
        const {done,value}=await rd.read();if(done)break;
        buf+=dec.decode(value,{stream:true});const lines=buf.split('\n');buf=lines.pop();
        for(const l of lines){
          if(!l.startsWith('data:'))continue;const d=l.slice(5).trim();if(!d||d==='[DONE]')continue;
          try{const dl=JSON.parse(d).choices?.[0]?.delta||{};
            const r=dl.reasoning_content||dl.reasoning;if(r)bot.think+=r;if(dl.content)bot.content+=dl.content;
            if(r||dl.content)paint()}catch(_){}
        }
      }
    }
    if(!bot.content.trim()&&!bot.think)throw new Error(`${PRE[k].name} returned an empty reply. The model id may be wrong or retired; pick another from the model menu.`);
    document.body.dataset.state='idle';
  }catch(err){
    if(err.name==='AbortError'){if(!bot.content&&!bot.think)c.msgs.pop();document.body.dataset.state='idle'}
    else{bot.err=err instanceof TypeError?`${PRE[k].name} did not answer. The request failed before any response came back, which is what a CORS block looks like. ${proxyOn()?'The proxy is on, so check that your server can reach '+PRE[k].host+'.':'Run server.mjs from the download (node server.mjs) and open the site through it, or turn on the proxy option under API keys.'}`:err.message;document.body.dataset.state='error'}
  }
  bot.live=false;bot.ms=performance.now()-t0;busy=false;ctrl=null;save();render();bottom();
}

/* connect from the empty state */
document.addEventListener('submit',async e=>{
  const f=e.target.closest('form.prov');if(!f)return;e.preventDefault();
  const k=f.dataset.k,v=f.querySelector('input').value.trim(),msg=$('#pm-'+k);if(!v)return;
  const b=f.querySelector('.go');b.disabled=true;b.textContent='Connecting';
  S.keys[k]=v;save();await loadModels(k);
  if(!entries().includes(S.model))S.model=k+'|'+mods(k)[0];
  save();render();
});

/* events */
$('#in').addEventListener('input',e=>{e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,240)+'px';gate()});
$('#in').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();if(!busy&&!$('#send').disabled)send()}});
$('#send').onclick=()=>send();
$('#q').oninput=renderList;
$('#scroll').addEventListener('scroll',()=>{const e=$('#scroll');$('#jump').hidden=e.scrollHeight-e.scrollTop-e.clientHeight<240},{passive:true});
$('#jump').onclick=()=>$('#scroll').scrollTo({top:$('#scroll').scrollHeight,behavior:'smooth'});
addEventListener('pointermove',e=>{
  document.querySelectorAll('.mascot').forEach(s=>{const r=s.getBoundingClientRect();if(!r.width)return;
    const dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height*.5),d=Math.hypot(dx,dy)||1,f=Math.min(1,d/160);
    L0.x=+(dx/d*4*f).toFixed(2);L0.y=+(dy/d*3.5*f).toFixed(2);
    s.style.setProperty('--lx',L0.x+'px');s.style.setProperty('--ly',L0.y+'px')})
},{passive:true});
$('#new').onclick=newChat;$('#newtop').onclick=newChat;$('#scrim').onclick=()=>document.body.classList.remove('open');$('#kbd').textContent=MAC?'\u2318 K':'Ctrl K';
$('#mbtn').onclick=e=>{e.stopPropagation();openMenu()};
$('#side').onclick=()=>{if(innerWidth<=760)document.body.classList.toggle('open');else document.body.classList.toggle('collapsed')};
window.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&!e.shiftKey&&!e.altKey&&(e.code==='KeyK'||(e.key||'').toLowerCase()==='k')){e.preventDefault();e.stopPropagation();if(!$('#dlg').open)newChat()}
  else if(e.key==='Escape'){closeMenu();document.body.classList.remove('open')}
},true);
document.addEventListener('click',e=>{
  if(!e.target.closest('#pop'))closeMenu();
  const t=e.target.closest('button');if(!t)return;
  const d=t.dataset;
  if(d.open){S.cur=d.open;save();render();document.body.classList.remove('open');bottom()}
  else if(d.del){S.chats=S.chats.filter(c=>c.id!==d.del);if(S.cur===d.del)S.cur=null;save();render()}
  else if(d.pick){setModel(d.pick)}
  else if('copy' in d){copyText(t.closest('pre').querySelector('code').textContent).then(ok=>flash(t,ok))}
  else if(d.cm){const m=cur().msgs[d.cm];copyText(m.err||m.content||'').then(ok=>flash(t,ok))}
  else if(d.eff){S.effort[S.model]=d.eff;save();buildMenu();render()}
  else if('regen' in d)send(true);
  else if('settings' in d){closeMenu();openSettings()}
  else if(d.rm){$('#k-'+d.rm).value=''}
});
function openSettings(){KEYS.forEach(k=>{$('#k-'+k).value=S.keys[k]||'';const b=$('#b-'+k);b.value=S.base[k]||'';b.placeholder=PRE[k].base});$('#sys').value=S.sys||'';$('#px').checked=proxyOn();$('#dlg').showModal()}
$('#gear').onclick=openSettings;
$('#form').addEventListener('submit',async e=>{
  if(!e.submitter||e.submitter.value!=='ok')return;
  S.sys=$('#sys').value.trim();S.proxy=$('#px').checked;
  for(const k of KEYS){
    const key=$('#k-'+k).value.trim(),b=$('#b-'+k).value.trim();
    S.base[k]=b;const changed=S.keys[k]!==key;S.keys[k]=key;
    if(!key){S.models[k]=[]}else if(changed||b)await loadModels(k);
  }
  if(!entries().includes(S.model))S.model=entries()[0]||'';
  save();render();
});
function theme(v){if(v)document.documentElement.dataset.theme=v;else delete document.documentElement.dataset.theme}
theme(S.theme);
$('#theme').onclick=()=>{const dk=matchMedia('(prefers-color-scheme:dark)').matches;const now=S.theme||(dk?'dark':'light');S.theme=now==='dark'?'light':'dark';theme(S.theme);save()};

if(!entries().includes(S.model))S.model=entries()[0]||'';
render();if(entries().length&&matchMedia('(hover:hover)').matches)$('#in').focus();
fetch('/_ralpha').then(r=>r.ok?r.text():'').then(t=>{if(t==='ok'){PROXY=true;if(S.proxy===undefined)KEYS.forEach(k=>{if(S.keys[k])loadModels(k).then(ok=>{if(ok)render()})})}}).catch(()=>{});
KEYS.forEach(k=>{if(S.keys[k]&&Date.now()-(S.mt[k]||0)>432e5)loadModels(k).then(ok=>{if(ok)render()})});
</script>
</body>
</html>
